# Throwaway diagnostic (branch diag/meta-eu-check only). Observes the Meta pixel
# on the live site and on local synthetic pages from US and EU/UK vantages.
# Read-only against the site; does not build or deploy anything.
name: meta-eu-diag
on:
  push:
    branches: [diag/meta-eu-check]
  workflow_dispatch:
# contents:write is used only to push the results to the hidden throwaway ref
# refs/diag/meta-eu-results (deleted after the investigation).
permissions:
  contents: write
concurrency:
  group: meta-eu-diag
  cancel-in-progress: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/diag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright, Chromium and Tor
        working-directory: .github/diag
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y tor >/dev/null
          sudo systemctl stop tor || true
          sudo systemctl disable tor || true
          echo "127.0.0.1 diag.localtest.me" | sudo tee -a /etc/hosts
          tor --version | head -1
      - name: Run scenarios
        working-directory: .github/diag
        env:
          DIAG_ONLY: TORUS,NL,TORCA
          DIAG_SKIP_SURVEY: '1'
          SURVEY_DEADLINE_MS: '450000'
        run: |
          set -o pipefail
          mkdir -p out
          node peers.mjs 2>&1 | tee out/peers.log
      - name: Analyze captured Meta files
        if: always()
        working-directory: .github/diag
        run: node analyze.mjs > out/analyze.log 2>&1; tail -c 3000 out/analyze.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-eu-diag
          path: .github/diag/out
          retention-days: 7
      - name: Publish results to a hidden throwaway ref
        if: always()
        working-directory: .github/diag/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init -q -b results
          git config user.name "meta-eu-diag"
          git config user.email "meta-eu-diag@users.noreply.github.com"
          echo "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} sha ${GITHUB_SHA}" > RUN.txt
          git add -A
          git commit -q -m "diag results run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/diag/meta-eu-results
